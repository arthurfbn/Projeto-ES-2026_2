# Postgres local para desenvolvimento e testes de integração.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shavey
      POSTGRES_PASSWORD: shavey
      POSTGRES_DB: shavey
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shavey']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
